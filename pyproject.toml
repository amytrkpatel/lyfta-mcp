[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyfta-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Lyfta fitness data integration with Claude"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amy Patel", email = "amytrkpatel@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/lyfta-mcp"
Repository = "https://github.com/yourusername/lyfta-mcp.git"
Issues = "https://github.com/yourusername/lyfta-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Line too long — handled by formatter

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
